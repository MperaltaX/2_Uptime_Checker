version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: uptime_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uptime_checker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: uptime_api
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/uptime_checker
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    container_name: uptime_worker
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/uptime_checker
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: uptime_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000

volumes:
  pgdata:
